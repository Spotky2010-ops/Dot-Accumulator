<!DOCTYPE html>
<html>
<head>
    <title>Dot Accumulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.68, -0.6, 0.32, 1.6);
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
            --bg-color: #E8F5E9;
            --dot-color: #5B9BD5;
            --dot-shadow: #4A89C4;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --card-bg: rgba(255,255,255,0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-world {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Score display */
        .score-panel {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .score-label {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .score-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 56px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Grid container */
        .grid-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
        }

        /* Dot */
        .dot-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .dot {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7DB8E8, #5B9BD5 60%, #4A89C4);
            box-shadow: 0 3px 8px rgba(74,137,196,0.35);
            transition: transform 80ms var(--ease-bounce), box-shadow 180ms ease;
            animation: dotIdle var(--idle-duration, 2.8s) ease-in-out infinite;
            pointer-events: none;
        }
        .dot.tapped {
            animation: dotPop calc(250ms / var(--animation-speed, 1)) var(--ease-bounce);
        }
        .dot.golden {
            box-shadow: 0 0 0 3px rgba(255,215,79,0.28), 0 5px 18px rgba(221,155,30,0.55);
        }

        /* Floating +1 */
        .float-text {
            position: absolute;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #5B9BD5;
            pointer-events: none;
            animation: floatUp calc(600ms / var(--animation-speed, 1)) var(--ease-out) forwards;
            text-shadow: 0 1px 4px rgba(0,0,0,0.1);
            z-index: 20;
        }

        @keyframes dotIdle {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.055); filter: brightness(1.08); }
        }

        @keyframes dotPop {
            0% { transform: scale(1); }
            30% { transform: scale(0.5); opacity: 0.6; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        @keyframes scoreFlash {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 22;
            animation: particleBurst var(--particle-duration, 650ms) var(--ease-out) forwards;
            box-shadow: 0 1px 4px rgba(0,0,0,0.16);
        }
        @keyframes particleBurst {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.15) rotate(180deg); }
        }

        .milestone-banner {
            position: absolute;
            top: 168px;
            left: 50%;
            width: min(610px, calc(100% - 48px));
            box-sizing: border-box;
            padding: 22px 28px;
            border: 3px solid rgba(255,255,255,0.82);
            border-radius: 30px;
            background: linear-gradient(135deg, #F8C84E, #E99B2E);
            color: #fff;
            text-align: center;
            box-shadow: 0 14px 34px rgba(190,126,28,0.35), inset 0 2px 0 rgba(255,255,255,0.55);
            pointer-events: none;
            z-index: 35;
            animation: milestoneIn calc(520ms / var(--animation-speed, 1)) var(--ease-bounce) both;
        }
        .milestone-banner .milestone-kicker {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .milestone-banner .milestone-title {
            margin-top: 4px;
            font-family: 'Fredoka', sans-serif;
            font-size: 34px;
            font-weight: 700;
        }
        .milestone-banner .milestone-subtitle {
            margin-top: 4px;
            font-size: 16px;
            font-weight: 600;
        }
        .celebration-spark {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 34;
            animation: sparkFall calc(1100ms / var(--animation-speed, 1)) ease-out forwards;
        }
        @keyframes milestoneIn {
            0% { opacity: 0; transform: translate(-50%, -24px) scale(0.72); }
            65% { opacity: 1; transform: translate(-50%, 5px) scale(1.04); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes sparkFall {
            0% { opacity: 0; transform: translateY(-30px) scale(0.4) rotate(0deg); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translateY(360px) scale(0.9) rotate(300deg); }
        }

        .music-toggle {
            position: absolute;
            top: 32px;
            right: 24px;
            width: 96px;
            height: 96px;
            border: 0;
            border-radius: 28px;
            background: rgba(255,255,255,0.82);
            color: var(--text-primary);
            font-size: 34px;
            box-shadow: 0 8px 18px rgba(44,62,80,0.12);
            cursor: pointer;
            z-index: 25;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), background 180ms ease;
        }
        .music-toggle:active { transform: scale(0.93); }
        .music-toggle.off { opacity: 0.62; }

        .settings-button {
            position: absolute;
            top: 32px;
            right: 136px;
            width: 96px;
            height: 96px;
            border: 0;
            border-radius: 28px;
            background: rgba(255,255,255,0.82);
            color: var(--text-primary);
            font-size: 34px;
            box-shadow: 0 8px 18px rgba(44,62,80,0.12);
            cursor: pointer;
            z-index: 25;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), background 180ms ease;
        }
        .settings-button:active { transform: scale(0.93); }

        .settings-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(44, 62, 80, 0.34);
            z-index: 45;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--shop-duration, 300ms) ease, visibility var(--shop-duration, 300ms) ease;
        }
        .settings-overlay[hidden] { display: flex; }
        .settings-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .settings-sheet {
            width: min(620px, calc(100% - 16px));
            max-height: calc(100% - 48px);
            overflow: auto;
            box-sizing: border-box;
            padding: 28px;
            border-radius: 34px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 20px 60px rgba(44,62,80,0.28);
            transform: translateY(105%) scale(0.96);
            transition: transform var(--shop-duration, 300ms) var(--ease-bounce);
        }
        .settings-overlay.open .settings-sheet { transform: translateY(0) scale(1); }
        .settings-action-btn {
            display: block;
            width: 100%;
            min-height: 96px;
            margin-top: 14px;
            padding: 20px;
            border: 0;
            border-radius: 26px;
            background: linear-gradient(135deg, #2D9D78, #25876A);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), opacity 150ms ease;
            box-shadow: 0 6px 16px rgba(45,157,120,0.25);
        }
        .settings-action-btn:active { transform: scale(0.97); }
        .settings-action-btn.danger {
            background: linear-gradient(135deg, #E74C3C, #C0392B);
            box-shadow: 0 6px 16px rgba(231,76,60,0.25);
        }
        .settings-hint {
            margin: 20px 4px 0;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }
        .reset-confirm {
            display: none;
            margin-top: 12px;
            padding: 18px;
            border-radius: 20px;
            background: #FFF4E6;
            border: 2px solid #F39C12;
        }
        .reset-confirm.visible { display: block; }
        .reset-confirm-text {
            margin: 0 0 12px;
            color: #D68910;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }
        .reset-confirm-actions {
            display: flex;
            gap: 12px;
        }
        .reset-confirm-btn {
            flex: 1;
            min-height: 72px;
            padding: 12px;
            border: 0;
            border-radius: 18px;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce);
        }
        .reset-confirm-btn:active { transform: scale(0.95); }
        .reset-confirm-btn.cancel {
            background: #BDC3C7;
            color: #2C3E50;
        }
        .reset-confirm-btn.confirm {
            background: #E74C3C;
            color: white;
        }

        .status-toast {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 18px 28px;
            border-radius: 24px;
            background: rgba(45,157,120,0.95);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(45,157,120,0.35);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 250ms ease, transform 250ms var(--ease-bounce);
        }
        .status-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .status-toast.error {
            background: rgba(231,76,60,0.95);
            box-shadow: 0 10px 30px rgba(231,76,60,0.35);
        }

        /* Shop and upgrade UI */
        .shop-button {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            min-width: 220px;
            min-height: 96px;
            padding: 18px 30px;
            border: 0;
            border-radius: 30px;
            background: linear-gradient(135deg, #F28A9B, #E45B77);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 24px rgba(190,70,105,0.3), inset 0 2px 0 rgba(255,255,255,0.35);
            cursor: pointer;
            z-index: 25;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), filter 150ms ease;
        }
        .shop-button:active { transform: translateX(-50%) scale(0.95); }
        .shop-button:hover { filter: brightness(1.04); }

        .shop-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(44, 62, 80, 0.34);
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--shop-duration, 300ms) ease, visibility var(--shop-duration, 300ms) ease;
        }
        .shop-overlay[hidden] { display: flex; }
        .shop-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .shop-sheet {
            width: min(620px, calc(100% - 16px));
            max-height: calc(100% - 48px);
            overflow: auto;
            box-sizing: border-box;
            padding: 28px;
            border-radius: 34px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 20px 60px rgba(44,62,80,0.28);
            transform: translateY(105%) scale(0.96);
            transition: transform var(--shop-duration, 300ms) var(--ease-bounce);
        }
        .shop-overlay.open .shop-sheet { transform: translateY(0) scale(1); }
        .shop-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 22px;
        }
        .shop-kicker {
            color: #E45B77;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .shop-title {
            margin: 2px 0 4px;
            color: var(--text-primary);
            font-family: 'Fredoka', sans-serif;
            font-size: 40px;
            line-height: 1;
        }
        .shop-balance {
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: 600;
        }
        .shop-close {
            flex: 0 0 96px;
            width: 96px;
            height: 96px;
            border: 0;
            border-radius: 28px;
            background: #EEF3F5;
            color: var(--text-primary);
            font-size: 48px;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
        }
        .shop-close:active { transform: scale(0.94); }
        .upgrade-card {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 164px;
            margin-top: 14px;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid #E8EEF0;
            border-radius: 26px;
            background: linear-gradient(135deg, #FFFFFF, #F6FAFA);
        }
        .upgrade-icon {
            display: flex;
            flex: 0 0 72px;
            width: 72px;
            height: 72px;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: #FCE8ED;
            color: #E45B77;
            font-size: 38px;
        }
        .upgrade-card.auto .upgrade-icon { background: #E3F3F5; color: #2997B4; }
        .upgrade-card.lucky .upgrade-icon { background: #FFF2D8; color: #E08A2E; }
        .upgrade-card.power .upgrade-icon { background: #EAE2FA; color: #8058B5; }
        .upgrade-copy { flex: 1; min-width: 0; }
        .upgrade-name {
            margin: 0 0 4px;
            color: var(--text-primary);
            font-family: 'Fredoka', sans-serif;
            font-size: 25px;
        }
        .upgrade-description {
            margin: 0;
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.35;
        }
        .upgrade-level {
            display: inline-block;
            margin-top: 8px;
            color: #2997B4;
            font-size: 14px;
            font-weight: 700;
        }
        .upgrade-action {
            flex: 0 0 136px;
            min-width: 136px;
            min-height: 96px;
            padding: 12px;
            border: 0;
            border-radius: 22px;
            background: #2D9D78;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), opacity 150ms ease;
        }
        .upgrade-action:active:not(:disabled) { transform: scale(0.94); }
        .upgrade-action:disabled { cursor: not-allowed; opacity: 0.42; }
        .upgrade-action.purchased { background: #A8B7B9; }
        .upgrade-cost { display: block; margin-top: 5px; font-size: 14px; font-weight: 500; }
        .shop-hint {
            margin: 20px 4px 0;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }

        /* Prestige system */
        .prestige-button {
            position: absolute;
            left: 50%;
            bottom: 138px;
            transform: translateX(-50%);
            min-width: 220px;
            min-height: 96px;
            padding: 18px 30px;
            border: 0;
            border-radius: 30px;
            background: linear-gradient(135deg, #F2B632, #E08A2E);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 24px rgba(224,138,46,0.4), inset 0 2px 0 rgba(255,255,255,0.35);
            cursor: pointer;
            z-index: 25;
            touch-action: manipulation;
            transition: transform 120ms var(--ease-bounce), filter 150ms ease;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .prestige-button.unlocked {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .prestige-button:active { transform: translateX(-50%) scale(0.95); }
        .prestige-button:hover { filter: brightness(1.04); }

        .prestige-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(44, 62, 80, 0.34);
            z-index: 42;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--shop-duration, 300ms) ease, visibility var(--shop-duration, 300ms) ease;
        }
        .prestige-overlay[hidden] { display: flex; }
        .prestige-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .prestige-sheet {
            width: min(620px, calc(100% - 16px));
            max-height: calc(100% - 48px);
            overflow: auto;
            box-sizing: border-box;
            padding: 28px;
            border-radius: 34px;
            background: linear-gradient(135deg, #FFFBF0, #FFF8E1);
            box-shadow: 0 20px 60px rgba(224,138,46,0.35), inset 0 0 0 2px rgba(242,182,50,0.25);
            transform: translateY(105%) scale(0.96);
            transition: transform var(--shop-duration, 300ms) var(--ease-bounce);
        }
        .prestige-overlay.open .prestige-sheet { transform: translateY(0) scale(1); }
        .prestige-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .prestige-kicker {
            color: #E08A2E;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .prestige-title {
            margin: 8px 0;
            color: #2C3E50;
            font-family: 'Fredoka', sans-serif;
            font-size: 48px;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(242,182,50,0.2);
        }
        .prestige-subtitle {
            margin: 8px 0;
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: 500;
            line-height: 1.4;
        }
        .prestige-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }
        .prestige-stat {
            padding: 20px;
            border-radius: 22px;
            background: rgba(255,255,255,0.65);
            text-align: center;
        }
        .prestige-stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prestige-stat-value {
            margin-top: 8px;
            color: #2C3E50;
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
        }
        .prestige-benefit {
            padding: 20px;
            margin: 16px 0;
            border-radius: 22px;
            background: rgba(255,255,255,0.65);
            border: 2px solid rgba(242,182,50,0.3);
        }
        .prestige-benefit-title {
            color: #E08A2E;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prestige-benefit-value {
            margin-top: 6px;
            color: #2C3E50;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
        }
        .prestige-benefit-desc {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.4;
        }
        .prestige-upgrades-heading {
            margin: 28px 0 10px;
            color: #E08A2E;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
        }
        .prestige-upgrades-note {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }
        .prestige-upgrade-card {
            background: rgba(255,255,255,0.8);
            border-color: rgba(242,182,50,0.28);
        }
        .prestige-upgrade-card.golden .upgrade-icon {
            background: #FFF2C2;
            color: #D99616;
        }
        .prestige-upgrade-card.eternal .upgrade-icon {
            background: #E8E3FA;
            color: #6853B5;
        }
        .prestige-upgrade-card .upgrade-level {
            color: #B8791E;
        }
        .prestige-upgrade-card .upgrade-action {
            background: linear-gradient(135deg, #E8A92F, #C8791B);
            box-shadow: 0 5px 12px rgba(200,121,27,0.22);
        }
        .prestige-upgrade-card .upgrade-action.purchased {
            background: #B79B61;
        }
        .prestige-actions {

     * Dot Accumulator - Step 1: Tap dots to earn points

        const maxNumberExponent = Math.min(10000, Math.max(308, Math.floor(Number(cfg.maxNumberExponent) || 10000)));

        const breakInfinityPointsBaseReward = Math.max(1, Math.floor(Number(cfg.breakInfinityPointsBaseReward) || 1));
        const breakInfinityBonusPerPoint = Math.max(0, Math.floor(Number(cfg.breakInfinityBonusPerPoint) || 1000));

            else if (id === 'quantumRelay') quantumRelayLevel = safeLevel;
            else prestigeUpgradeLevels[id] = safeLevel;
        }

        function getPrestigeEffectTotal(kind) {
            return prestigeUpgradeDefs.reduce((total, def) => {
                const level = getPrestigeUpgradeLevel(def.id);
                const bonus = (def.effects || []).filter(effect => effect.kind === kind).reduce((sum, effect) => sum + effect.bonus, 0);
                return total + level * bonus;
            }, 0);
        }

        function getPrestigeAutoClickerCount() {
            return Math.max(0, Math.floor(getPrestigeEffectTotal('autoCount') + getInfinityEffectTotal('autoCount')));
        }

        function getPercentInteger(value, fallback) {
            const numeric = Number(value);
            return Math.max(0, Math.round(Number.isFinite(numeric) ? numeric : fallback));
        }

        function getPrestigeMultiplierRatio(points = prestigePoints) {
            const bonusPercent = getPercentInteger(cfg.prestigeBonusPerPoint, 10);
            return { numerator: 100n + (points * BigInt(bonusPercent)), denominator: 100n };
        }

        function getInfinityMultiplierRatio(points = infinityPoints) {
            return { numerator: 100n + (points * BigInt(infinityBonusPerPoint)), denominator: 100n };
        }

        function getBreakInfinityMultiplierRatio(points = breakInfinityPoints) {
            return { numerator: 100n + (points * BigInt(breakInfinityBonusPerPoint)), denominator: 100n };
        }

        function getGemPointMultiplierRatio() {
            const bonusPercent = Math.max(0, Math.round(gemPointBoostLevel * gemPointBoostPerLevel));
            return { numerator: 100n + BigInt(bonusPercent), denominator: 100n };
        }

        function getGemDropChance() {
            return Math.min(1, gemDropChance + gemMagnetLevel * gemMagnetChancePerLevel);
        }

        function getGemUpgradeCost(baseCost, level) {
            return BigInt(Math.max(1, Math.ceil(baseCost * Math.pow(gemUpgradeCostGrowth, level))));
        }

        function awardGemDrop(cell, tierId) {
            let earned = tierId === 'golden' ? BigInt(goldenGemReward) : 0n;
            if (Math.random() < getGemDropChance()) earned += 1n;

        }

        function getGoldenTouchRatio() {
            const bonusPercent = Math.max(0, Math.round(getPrestigeEffectTotal('goldenValue') + getInfinityEffectTotal('goldenValue')));
            return { numerator: 100n + BigInt(bonusPercent), denominator: 100n };
        }

        function getPrismaticCoreRatio() {
            const bonusPercent = Math.max(0, Math.round(getPrestigeEffectTotal('pointMultiplier')));
            return { numerator: 100n + BigInt(bonusPercent), denominator: 100n };
        }

        function getTotalPointMultiplierRatio(points = prestigePoints) {
            const prestigeRatio = getPrestigeMultiplierRatio(points);
            const prismaticRatio = getPrismaticCoreRatio();
            const infinityRatio = getInfinityMultiplierRatio();
            const infinityUpgradeRatio = getInfinityUpgradeMultiplierRatio();
            const breakInfinityRatio = getBreakInfinityMultiplierRatio();
            const gemRatio = getGemPointMultiplierRatio();
            return {
                numerator: prestigeRatio.numerator * prismaticRatio.numerator * infinityRatio.numerator * infinityUpgradeRatio.numerator * breakInfinityRatio.numerator * gemRatio.numerator,
                denominator: prestigeRatio.denominator * prismaticRatio.denominator * infinityRatio.denominator * infinityUpgradeRatio.denominator * breakInfinityRatio.denominator * gemRatio.denominator
            };
        }

        function multiplyByRatio(value, ratio) {
            return (value * ratio.numerator) / ratio.denominator;
        }

        function formatMultiplierRatio(ratio) {
            const safeLimit = 9007199254740991n;
            if (ratio.numerator <= safeLimit && ratio.denominator <= safeLimit) {
                return `×${(Number(ratio.numerator) / Number(ratio.denominator)).toFixed(1)}`;
            }
            return `×${formatNumber(ratio.numerator / ratio.denominator)}`;
        }

        function formatScientificInteger(value) {
            const negative = value < 0n;
            const digits = (negative ? -value : value).toString();
            if (digits.length === 1) return `${negative ? '-' : ''}${digits}`;
            const exponent = digits.length - 1;
            const significant = digits.slice(0, 3);
            const fraction = significant.slice(1).replace(/0+$/, '');
            return `${negative ? '-' : ''}${significant[0]}${fraction ? `.${fraction}` : ''}e${exponent}`;
        }

        function formatBigInt(value) {
            const integer = toBigInt(value);
            const absolute = integer < 0n ? -integer : integer;
            const scientificThreshold = toBigInt(Math.max(1e15, Number(cfg.scientificNotationThreshold) || 1e15));
            if (absolute >= scientificThreshold) return formatScientificInteger(integer);

            const suffixes = [
                { threshold: 1000000000000n, suffix: 'T' },
                { threshold: 1000000000n, suffix: 'B' },
                { threshold: 1000000n, suffix: 'M' },
                { threshold: 1000n, suffix: 'K' }
            ];
            const match = suffixes.find(item => absolute >= item.threshold);
            if (!match) return integer.toLocaleString();

            const whole = absolute / match.threshold;
            const remainder = absolute % match.threshold;
            const decimals = whole >= 100n ? 0 : whole >= 10n ? 1 : 2;
            let decimalText = '';
            if (decimals > 0) {
                const scale = 10n ** BigInt(decimals);
                decimalText = ((remainder * scale) / match.threshold).toString().padStart(decimals, '0').replace(/0+$/, '');
                if (decimalText) decimalText = `.${decimalText}`;
            }
            return `${integer < 0n ? '-' : ''}${whole}${decimalText}${match.suffix}`;
        }

        function formatNumber(value) {
            if (typeof value === 'number' && !Number.isInteger(value)) {
                if (!Number.isFinite(value)) return '0';
                if (Math.abs(value) >= 1e15) return value.toExponential(2).replace(/\\.?0+e/, 'e').replace(/e\\+/, 'e');
                return value.toFixed(1).replace(/\\.?0+$/, '');
            }
            return formatBigInt(value);
        }

        function lighten(hex, pct) {
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            const nr = Math.min(255, r + Math.round((255-r)*pct/100));
            const ng = Math.min(255, g + Math.round((255-g)*pct/100));
            const nb = Math.min(255, b + Math.round((255-b)*pct/100));
            return `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
        }
        function darken(hex, pct) {
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            const nr = Math.max(0, r - Math.round(r*pct/100));
            const ng = Math.max(0, g - Math.round(g*pct/100));
            const nb = Math.max(0, b - Math.round(b*pct/100));
            return `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
        }

        function createParticles(cell, color) {

            const cx = rect.left - gwRect.left + rect.width / 2;

        let audioCtx = null;
        const audioBuffers = {};

        let musicGain = null;

        function ensureAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function preloadAudioAsset(id) {
            if (audioBuffers[id]) return Promise.resolve(audioBuffers[id]);
            if (audioLoading[id]) return audioLoading[id];
            try {
                const asset = lib.getAsset(id);
                if (!asset || !asset.url) return Promise.reject(new Error(`Missing audio asset: ${id}`));
                audioLoading[id] = fetch(asset.url)
                    .then(response => response.arrayBuffer())
                    .then(data => {
                        const ctx = ensureAudioContext();
                        return ctx.decodeAudioData(data);
                    })
                    .then(buffer => {
                        audioBuffers[id] = buffer;
                        return buffer;
                    })
                    .finally(() => { delete audioLoading[id]; });
                return audioLoading[id];
            } catch (e) {
                return Promise.reject(e);
            }
        }

        function playAssetSound(id, volume) {
            try {
                const buffer = audioBuffers[id];
                if (!buffer) {
                    preloadAudioAsset(id).catch(() => {});
                    return false;
                }
                const ctx = ensureAudioContext();
                const source = ctx.createBufferSource();
                const gain = ctx.createGain();
                source.buffer = buffer;
                gain.gain.value = Math.max(0, Math.min(1, volume * sfxVolume));
                source.connect(gain);
                gain.connect(ctx.destination);
                source.start();
                return true;
            } catch (e) {
                return false;
            }
        }

        function playUnlockSound() {
            if (!playAssetSound('unlock_sfx', 0.82)) playToneSequence([523, 659, 784, 1047], 0.6, 0.09);

        function playMilestoneSound() {

        }
        function playToneSequence(notes, duration, volume) {
            try {
                const ctx = ensureAudioContext();
                const now = ctx.currentTime;
                notes.forEach((frequency, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    const start = now + index * (duration / notes.length);
                    osc.frequency.setValueAtTime(frequency, start);
                    gain.gain.setValueAtTime(volume * sfxVolume, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + duration / notes.length * 0.9);
                    osc.start(start);
                    osc.stop(start + duration / notes.length);
                });
            } catch(e) {}
        }
        function playTapSound() {
            if (!playAssetSound('tap_sfx', 0.38)) playToneSequence([880, 1320], 0.15, 0.08);
        }

                if (!musicEnabled || musicSource) return;
                try {
                    const ctx = ensureAudioContext();
                    const source = ctx.createBufferSource();
                    const gain = ctx.createGain();
                    source.buffer = buffer;
                    source.loop = true;
                    gain.gain.value = musicVolume;
                    source.connect(gain);
                    gain.connect(ctx.destination);
                    source.start();
                    musicSource = source;
                    musicGain = gain;
                } catch (e) {}
            }).catch(() => {});
        }
        function stopBackgroundMusic() {
            if (!musicSource) return;
            try { musicSource.stop(); } catch (e) {}
            try { musicSource.disconnect(); } catch (e) {}
            if (musicGain) {
                try { musicGain.disconnect(); } catch (e) {}
            }
            musicSource = null;
            musicGain = null;

                    prestigePages.push(panel);
                }
            }
            buildPrestigePages();
            function selectPrestigePage(page) {
                prestigePage = page;
                prestigeTabs.forEach(tab => {
                    const active = Number(tab.dataset.prestigePage) === page;
                    tab.classList.toggle('active', active);
                    tab.setAttribute('aria-selected', String(active));
                });
                prestigePages.forEach(panel => {
                    panel.classList.toggle('active', Number(panel.dataset.prestigePanel) === page);
                });
            }
            prestigeTabs.forEach(tab => {
                tab.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    selectPrestigePage(Number(tab.dataset.prestigePage));
                });
            });

            prestigeOverlay.addEventListener('pointerdown', (e) => {
                if (e.target === prestigeOverlay) {
                    prestigeOpen = false;
                    prestigeOverlay.classList.remove('open');
                    prestigeOverlay.hidden = true;
                }
            });

            function updatePrestigeUI() {
                const currentPoints = prestigeOverlay.querySelector('#prestige-current-points');
                const countDisplay = prestigeOverlay.querySelector('#prestige-count-display');
                const pointsEarned = prestigeOverlay.querySelector('#prestige-points-earned');
                const newMultiplier = prestigeOverlay.querySelector('#prestige-new-multiplier');
                const bonusDesc = prestigeOverlay.querySelector('#prestige-bonus-desc');
                currentPoints.textContent = formatNumber(prestigePoints);
                countDisplay.textContent = formatNumber(prestigeCount);

                const earned = calculatePrestigePointsEarned();
                pointsEarned.textContent = `${formatNumber(earned)} ⭐`;

                const newTotal = prestigePoints + earned;
                const newMult = getTotalPointMultiplierRatio(newTotal);
                newMultiplier.textContent = formatMultiplierRatio(newMult);
                const bonusPercent = Number(cfg.prestigeBonusPerPoint) || 10;
                bonusDesc.textContent = `+${bonusPercent}% to all points earned per Prestige Point`;

                prestigeUpgradeDefs.forEach(def => {
                    const level = getPrestigeUpgradeLevel(def.id);
                    const cost = getPrestigeUpgradeCost(def.baseCost, def.costGrowth, level);
                    const levelDisplay = prestigeOverlay.querySelector(`[data-upgrade-level="${def.id}"]`);
                    const action = prestigeOverlay.querySelector(`[data-upgrade-action="${def.id}"]`);
                    if (!levelDisplay || !action) return;
                    const effect = (def.effects || [])[0];
                    const effectValue = level * (effect ? effect.bonus : 0);
                    const effectLabels = {
                        pointMultiplier: 'all points',
                        goldenValue: 'Golden value',
                        autoSpeed: 'engine speed',
                        autoCount: 'collectors',
                        rareSpawn: 'rare spawns',
                        prestigeGain: 'Prestige gain'
                    };
                    const suffix = effect ? ` · +${effectValue}% ${effectLabels[effect.kind] || 'power'}` : '';
                    levelDisplay.textContent = `Level ${level} / ${def.maxLevel}${suffix}`;
                    const maxed = level >= def.maxLevel;
                    action.disabled = maxed || prestigePoints < cost;
                    action.classList.toggle('purchased', maxed);
                    action.innerHTML = maxed ? 'Max Level' : `Buy<span class="upgrade-cost">${formatNumber(cost)} ⭐</span>`;
                });

                selectPrestigePage(prestigePage);
            }

            return { prestigeButton, prestigeOverlay, updatePrestigeUI };
        }

        async function performPrestige() {
            const pointsEarned = calculatePrestigePointsEarned();
            if (pointsEarned === 0n) {
                const threshold = getPrestigeUnlockThreshold();
                showStatusToast(`Need at least ${formatNumber(threshold)} points to prestige`, true);
                return;
            }

            // Award prestige points
            prestigePoints += pointsEarned;
            prestigeCount += 1;

            // Reset game state (but keep prestige)
            score = 0n;
            tapMultiplier = 1;
            tapMultiplierLevel = 1;
            autoClickers = getPrestigeAutoClickerCount();
            luckyDotsPurchased = false;
            powerTapPurchased = false;
            nextMilestoneIndex = 0;
            colorTiers.forEach(tier => { tier.seen = false; });

            // Stop auto-clicker
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            if (eternalEngineLevel > 0) startAutoClicker();

            // Update UI
            updateScore();
            buildGrid();
            if (shopOpen) updateShop();

            // Show celebration
            showStatusToast(`Prestiged! Earned ${formatNumber(pointsEarned)} ⭐`);
            playMilestoneSound();

            // Auto-save after prestige
            await saveProgress();
        }

        async function performInfinity() {

            if (pointsEarned === 0n) {

            // Infinity is the middle reset layer: keep Infinity Points and the

            const existing = gameWorld.querySelector('.status-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'status-toast' + (isError ? ' error' : '');
            toast.textContent = message;
            gameWorld.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.add('visible');
            });
            setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.remove(), 300);

        async function saveProgress() {
            try {
                const saveData = {
                    score: score.toString(),
                    tapMultiplier: tapMultiplier,
                    tapMultiplierLevel: tapMultiplierLevel,
                    autoClickers: autoClickers,
                    luckyDotsPurchased: luckyDotsPurchased,
                    powerTapPurchased: powerTapPurchased,
                    nextMilestoneIndex: nextMilestoneIndex,
                    colorTiersSeen: colorTiers.map(tier => ({ id: tier.id, seen: tier.seen || false })),
                    prestigePoints: prestigePoints.toString(),
                    prestigeCount: prestigeCount,
                    infinityPoints: infinityPoints.toString(),
                    infinityCount: infinityCount,
                    breakInfinityPoints: breakInfinityPoints.toString(),
                    breakInfinityCount: breakInfinityCount,
                    breakInfinityHeight: breakInfinityHeight,
                    goldenTouchLevel: goldenTouchLevel,
                    eternalEngineLevel: eternalEngineLevel,
                    prismaticCoreLevel: prismaticCoreLevel,
                    quantumRelayLevel: quantumRelayLevel,
                    prestigeUpgradeLevels: { ...prestigeUpgradeLevels },
                    infinityUpgradeLevels: { ...infinityUpgradeLevels },
                    gems: gems.toString(),
                    gemPointBoostLevel: gemPointBoostLevel,
                    gemMagnetLevel: gemMagnetLevel
                };
                await lib.saveUserGameState(saveData);
                showStatusToast('Progress saved!');
                playPurchaseSound();
            } catch (error) {
                lib.log(`Failed to save progress: ${error.message}`);
                showStatusToast('Failed to save progress', true);
            }
        }

        async function loadProgress() {
            try {
                const response = await lib.getUserGameState();
                if (response.state) {
                    const savedData = response.state;
                    // Validate and restore data
                    score = parseBigInt(savedData.score, 0n);
                    if (score < 0n) score = 0n;
                    if (score > maxScoreValue) score = maxScoreValue;
                    tapMultiplier = typeof savedData.tapMultiplier === 'number' && savedData.tapMultiplier >= 1 ? savedData.tapMultiplier : 1;
                    tapMultiplierLevel = typeof savedData.tapMultiplierLevel === 'number' && savedData.tapMultiplierLevel >= 1 ? savedData.tapMultiplierLevel : 1;
                    autoClickers = typeof savedData.autoClickers === 'number' ? savedData.autoClickers : 0;
                    luckyDotsPurchased = Boolean(savedData.luckyDotsPurchased);
                    powerTapPurchased = Boolean(savedData.powerTapPurchased);
                    nextMilestoneIndex = typeof savedData.nextMilestoneIndex === 'number' ? savedData.nextMilestoneIndex : 0;
                    
                    // Restore prestige state
                    prestigePoints = parseBigInt(savedData.prestigePoints, 0n);
                    if (prestigePoints < 0n) prestigePoints = 0n;
                    prestigeCount = typeof savedData.prestigeCount === 'number' && savedData.prestigeCount >= 0 ? savedData.prestigeCount : 0;
                    infinityPoints = parseBigInt(savedData.infinityPoints, 0n);
                    if (infinityPoints < 0n) infinityPoints = 0n;
                    infinityCount = typeof savedData.infinityCount === 'number' && savedData.infinityCount >= 0 ? savedData.infinityCount : 0;
                    
                    // Restore Break Infinity state (backward compatible)
                    breakInfinityPoints = parseBigInt(savedData.breakInfinityPoints, 0n);
                    if (breakInfinityPoints < 0n) breakInfinityPoints = 0n;
                    breakInfinityCount = typeof savedData.breakInfinityCount === 'number' && savedData.breakInfinityCount >= 0 ? savedData.breakInfinityCount : 0;
                    breakInfinityHeight = typeof savedData.breakInfinityHeight === 'number' && Number.isFinite(savedData.breakInfinityHeight) && savedData.breakInfinityHeight >= 2 ? Math.min(maxTetrationHeight, Math.floor(savedData.breakInfinityHeight)) : 2;
                    
                    // Restore prestige upgrade levels
                    setPrestigeUpgradeLevel('goldenTouch', savedData.goldenTouchLevel);
                    setPrestigeUpgradeLevel('eternalEngine', savedData.eternalEngineLevel);
                    setPrestigeUpgradeLevel('prismaticCore', savedData.prismaticCoreLevel);
                    setPrestigeUpgradeLevel('quantumRelay', savedData.quantumRelayLevel);
                    if (savedData.prestigeUpgradeLevels && typeof savedData.prestigeUpgradeLevels === 'object') {
                        prestigeUpgradeDefs.filter(def => !def.legacy).forEach(def => {
                            setPrestigeUpgradeLevel(def.id, savedData.prestigeUpgradeLevels[def.id]);
                        });
                    }
                    if (savedData.infinityUpgradeLevels && typeof savedData.infinityUpgradeLevels === 'object') {
                        infinityUpgradeDefs.forEach(def => {
                            setInfinityUpgradeLevel(def.id, savedData.infinityUpgradeLevels[def.id]);
                        });
                    }
                    autoClickers = Math.max(autoClickers, getPrestigeAutoClickerCount());
                    
                    // Restore Gems feature state (backward compatible)
                    gems = parseBigInt(savedData.gems, 0n);
                    if (gems < 0n) gems = 0n;
                    gemPointBoostLevel = typeof savedData.gemPointBoostLevel === 'number' && Number.isFinite(savedData.gemPointBoostLevel) ? Math.max(0, Math.floor(savedData.gemPointBoostLevel)) : 0;
                    gemMagnetLevel = typeof savedData.gemMagnetLevel === 'number' && Number.isFinite(savedData.gemMagnetLevel) ? Math.max(0, Math.floor(savedData.gemMagnetLevel)) : 0;
                    
                    // Restore color tier seen state
                    if (Array.isArray(savedData.colorTiersSeen)) {
                        savedData.colorTiersSeen.forEach(saved => {
                            const tier = colorTiers.find(t => t.id === saved.id);
                            if (tier) tier.seen = saved.seen;
                        });
                    }

                    // Update UI
                    updateScore();
                    buildGrid();
                    if (shopOpen) updateShop();
                    if (prestigeOpen) updatePrestigeUI();
                    if (infinityOpen) updateInfinityUI();
                    if (breakInfinityOpen) updateBreakInfinityUI();
                    
                    // Restart auto-clicker if needed
                    if (autoClickers > 0 && !autoTimer) {
                        startAutoClicker();
                    }

                    showStatusToast('Progress loaded!');
                    playUnlockSound();
                } else {
                    showStatusToast('No saved progress found', true);
                }
            } catch (error) {
                lib.log(`Failed to load progress: ${error.message}`);
                showStatusToast('Failed to load progress', true);
            }
        }

                tapMultiplierLevel = 1;
                autoClickers = 0;
                luckyDotsPurchased = false;
                powerTapPurchased = false;

                prestigeCount = 0;
                infinityPoints = 0n;
                infinityCount = 0;
                breakInfinityPoints = 0n;
                breakInfinityCount = 0;
                breakInfinityHeight = 2;
                goldenTouchLevel = 0;
                eternalEngineLevel = 0;
                prismaticCoreLevel = 0;
                quantumRelayLevel = 0;
                prestigeUpgradeDefs.filter(def => !def.legacy).forEach(def => { prestigeUpgradeLevels[def.id] = 0; });
                infinityUpgradeDefs.forEach(def => { infinityUpgradeLevels[def.id] = 0; });
                gems = 0n;
                gemPointBoostLevel = 0;
                gemMagnetLevel = 0;
                colorTiers.forEach(tier => { tier.seen = false; });
                
                // Stop auto-clicker
                if (autoTimer) {
                    clearInterval(autoTimer);
                    autoTimer = null;
                }

                // Update UI
                updateScore();
                buildGrid();
                updatePrestigeUI();
                updateInfinityUI();
                updateBreakInfinityUI();
                if (shopOpen) updateShop();
                
                showStatusToast('Progress reset!');
                playTapSound();
            } catch (error) {
                lib.log(`Failed to reset progress: ${error.message}`);
                showStatusToast('Failed to reset progress', true);
            }
